# ---------------------------------------------------------------------
# NOTE on signing in:
# On the login screen, click "Sign In with Token" rather than the
# GitHub button. It'll link you to GitHub's token creation page with
# the right scope (repo access) pre-selected — generate one, paste it
# in. This is the simplest method for a single editor and doesn't
# require setting up a separate OAuth app.
#
# If you later want other people (e.g. the store owner) to log in
# with their own GitHub account via a "Login with GitHub" button
# instead of pasting a token, that needs an OAuth app + a small proxy
# (Sveltia's docs call this "Sveltia CMS Authenticator", deployable
# free on Cloudflare Workers) — a separate, optional step.
# ---------------------------------------------------------------------
