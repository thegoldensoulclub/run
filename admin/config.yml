backend:
  name: github
  repo: thegoldensoulclub/run   # owner/repo — update if this isn't exactly right
  branch: main

# Sign-in uses a GitHub personal access token by default (click "Sign In
# with Token" on the login screen) — no OAuth app or proxy server needed
# for a single editor. See the note at the bottom of this file.

media_folder: "assets/products"
public_folder: "assets/products"

collections:
  - name: "products"
    label: "Shop Products"
    files:
      - name: "products"
        label: "Product Catalog"
        file: "content/products.json"
        fields:
          - name: "products"
            label: "Products"
            widget: "list"
            summary: "{{fields.name}} — ${{fields.price}} {{fields.featured}}"
            fields:
              - { name: "name", label: "Name", widget: "string" }
              - { name: "collection", label: "Collection", widget: "select", options: ["Running", "Everyday Wear"] }
              - { name: "cat", label: "Category (e.g. Tops, Shorts, Headwear)", widget: "string" }
              - { name: "price", label: "Price (USD)", widget: "number", value_type: "int", min: 0 }
              - { name: "featured", label: "Featured on homepage", widget: "boolean", default: false }
              - { name: "soldOut", label: "Sold out", widget: "boolean", default: false }
              - { name: "url", label: "Product page URL (thegoldensoulclub.com)", widget: "string", required: false }
              - { name: "image", label: "Image URL", widget: "string", required: false, hint: "Right-click the product photo on thegoldensoulclub.com → Copy image address. Add &format=jpg to the end if it's a .heic file." }
              - name: "icon"
                label: "Fallback icon (only used if no Image URL is set)"
                widget: "select"
                required: false
                options: ["shoe", "tee", "short", "jacket", "cap", "sock", "singlet", "sweater", "jersey"]

  - name: "site_text"
    label: "Page Text"
    files:
      - name: "site_text_en"
        label: "Page Text — English"
        file: "content/site-en.json"
        fields:
          - name: "nav"
            label: "Navigation"
            widget: "object"
            collapsed: true
            fields:
              - { name: "nav_club", label: "Nav: Run Club link", widget: "string" }
              - { name: "nav_join", label: "Nav: Join link", widget: "string" }
              - { name: "nav_checkin", label: "Nav: Check In link", widget: "string" }
              - { name: "nav_wall", label: "Nav: Wall link", widget: "string" }
              - { name: "nav_shop", label: "Nav: Shop link", widget: "string" }
          - name: "hero"
            label: "Hero (top of page)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "hero_eyebrow", label: "Small line above the headline", widget: "string" }
              - { name: "hero_h1", label: "Main headline (HTML — keep <br> and <em> tags)", widget: "string" }
              - { name: "hero_sub", label: "Paragraph under the headline", widget: "text" }
              - { name: "hero_btn_join", label: "Button: Join the run club", widget: "string" }
              - { name: "hero_btn_shop", label: "Button: Shop the store", widget: "string" }
              - { name: "clock_label", label: "Countdown label", widget: "string" }
              - { name: "clock_days", label: "Countdown unit: Days", widget: "string" }
              - { name: "clock_hrs", label: "Countdown unit: Hours", widget: "string" }
              - { name: "clock_min", label: "Countdown unit: Minutes", widget: "string" }
              - { name: "clock_sec", label: "Countdown unit: Seconds", widget: "string" }
              - { name: "clock_meta", label: "Time/location line under countdown", widget: "string" }
          - name: "club"
            label: "Run Club Section"
            widget: "object"
            collapsed: true
            fields:
              - { name: "club_kicker", label: "Small label above section title", widget: "string" }
              - { name: "club_h2", label: "Section title", widget: "string" }
              - { name: "fact1_t", label: "Fact 1 title", widget: "string" }
              - { name: "fact1_b", label: "Fact 1 description", widget: "string" }
              - { name: "fact2_t", label: "Fact 2 title", widget: "string" }
              - { name: "fact2_b", label: "Fact 2 description", widget: "string" }
